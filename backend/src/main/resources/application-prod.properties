spring.application.name=backend

# URL du frontend en prod (tu pourras remplacer par ton domaine railway.app ou ton .fr)
app.frontend.url=${FRONTEND_URL:https://djplace.fr}

# PostgreSQL sur Railway (Railway fournit souvent une URL globale ou des variables séparées)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# En prod, on évite d'afficher tout le SQL dans les logs et on passe d'update à validate ou none pour sécuriser la BDD
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Port dynamique imposé par Railway
server.port=${PORT:8080}