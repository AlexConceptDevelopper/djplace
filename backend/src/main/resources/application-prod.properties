spring.application.name=backend

profile=prod

# URL du frontend en prod (tu pourras remplacer par ton domaine railway.app ou ton .fr)
app.frontend.url=${FRONTEND_URL:https://www.djplace.fr}

# PostgreSQL sur Railway (Railway fournit souvent une URL globale ou des variables séparées)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
